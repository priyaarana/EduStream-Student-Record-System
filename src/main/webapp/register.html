<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card" style="width:420px;">
            <h2>📝 Student Registration</h2>
            <p class="sub">Create your account to access your student profile</p>
            <form action="register" method="post">
                <p class="field-label">Full Name</p>
                <input type="text" name="name" required>
                <p class="field-label">Course</p>
                <input type="text" name="course" required>
                <p class="field-label">Department</p>
                <input type="text" name="department" required>
                <p class="field-label">Email</p>
                <input type="text" name="email" required>
                <p class="field-label">Clubs (optional)</p>
                <input type="text" name="clubs" placeholder="e.g. Coding Club, Drama Club">
                <p class="field-label">Choose a Username</p>
                <input type="text" name="username" required>
                <p class="field-label">Choose a Password</p>
                <input type="password" name="password" required>
                <input type="submit" value="Register">
            </form>
            <p style="margin-top:16px; font-size:13px;"><a href="login.html">&larr; Back to Login</a></p>
        </div>
    </div>
</body>
</html>
